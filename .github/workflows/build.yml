name: Build Port Manager

on:
  push:
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Run unit tests
        run: dotnet test PortManager.Tests/PortManager.Tests.csproj --configuration Release
      - name: Run Windows Firewall integration test
        shell: pwsh
        env:
          PORTMANAGER_RUN_INTEGRATION: "1"
        run: dotnet test PortManager.Tests/PortManager.Tests.csproj --configuration Release --no-build --filter "Category=WindowsIntegration"

  build:
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x86
            platform: x86
            installer_arch: x86
          - rid: win-x64
            platform: x64
            installer_arch: x64
          - rid: win-arm64
            platform: ARM64
            installer_arch: arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore PortManager.csproj --runtime ${{ matrix.rid }} -p:Platform=${{ matrix.platform }} -p:WindowsPackageType=None
      - name: Build
        run: dotnet build PortManager.csproj --configuration Release --no-restore -p:Platform=${{ matrix.platform }} -p:WindowsPackageType=None
      - name: Dump XAML compiler diagnostics
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem -Path obj -Recurse -Filter output.json -ErrorAction SilentlyContinue |
            ForEach-Object { Get-Content $_.FullName -Raw }
      - name: Publish portable app
        run: dotnet publish PortManager.csproj --configuration Release --no-restore --runtime ${{ matrix.rid }} --self-contained true -p:Platform=${{ matrix.platform }} -p:WindowsPackageType=None -o artifacts/portable/${{ matrix.rid }}
      - name: Keep only Chinese and English resources
        shell: pwsh
        run: |
          $publishDirectory = "artifacts/portable/${{ matrix.rid }}"
          $allowedCultures = @("en", "en-US", "zh", "zh-CN", "zh-Hans")
          $culturePattern = '^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$'
          Get-ChildItem $publishDirectory -Directory |
            Where-Object { $_.Name -match $culturePattern -and $_.Name -notin $allowedCultures } |
            Remove-Item -Recurse -Force

          $unexpected = Get-ChildItem $publishDirectory -Directory |
            Where-Object { $_.Name -match $culturePattern -and $_.Name -notin $allowedCultures }
          if ($unexpected) {
            throw "Unexpected language resources: $($unexpected.Name -join ', ')"
          }
      - name: Add portable package instructions
        shell: pwsh
        run: |
          $publishDirectory = "artifacts/portable/${{ matrix.rid }}"
          $architecture = '${{ matrix.installer_arch }}'
          $instructions = @"
          Port Manager ${{ github.ref_name }}

          Architecture: $architecture

          Choose the package matching your Windows system:
            x64   - Intel/AMD 64-bit Windows (most PCs)
            x86   - 32-bit Windows
            arm64 - Windows on ARM devices

          Run PortManager.exe as administrator. The app requires administrator
          permission to read and change Windows Firewall rules.

          If the program does not open, verify that the package architecture
          matches Settings > System > About > System type.
          "@
          Set-Content -Path "$publishDirectory\README.txt" -Value $instructions -Encoding UTF8
      - name: Smoke test packaged application startup
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $executable = Join-Path $pwd "artifacts/portable/win-x64/PortManager.exe"
          $logPath = Join-Path $env:LOCALAPPDATA "PortManager/startup.log"
          Remove-Item $logPath -Force -ErrorAction SilentlyContinue

          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class PortManagerWindowTest
          {
              [DllImport("user32.dll")]
              public static extern bool ShowWindowAsync(IntPtr window, int command);
              [DllImport("user32.dll")]
              public static extern bool IsIconic(IntPtr window);
              [DllImport("user32.dll")]
              public static extern bool PostMessage(IntPtr window, uint message, IntPtr wParam, IntPtr lParam);
              [DllImport("user32.dll")]
              public static extern IntPtr SendMessage(IntPtr window, uint message, IntPtr wParam, IntPtr lParam);
              [DllImport("user32.dll", EntryPoint = "GetClassLongPtrW")]
              public static extern IntPtr GetClassLongPtr(IntPtr window, int index);
          }
          '@

          $process = Start-Process -FilePath $executable -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(30)
            $dashboardLoaded = $false
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 1
              $process.Refresh()
              if (Test-Path $logPath) {
                $log = Get-Content $logPath -Raw
                if ($log -match 'Application initialization failed|Unable to open the main window|Unexpected application error') {
                  throw "Application startup failed:`n$log"
                }
                if ($log -match 'Navigation completed: DashboardPage\.') {
                  $dashboardLoaded = $true
                  break
                }
              }
              if ($process.HasExited) {
                throw "Application exited during startup with code $($process.ExitCode)."
              }
            }

            if (-not $dashboardLoaded) {
              $log = if (Test-Path $logPath) { Get-Content $logPath -Raw } else { '<no startup log>' }
              throw "Dashboard did not load within 30 seconds:`n$log"
            }

            $log = Get-Content $logPath -Raw
            if ($log -notmatch 'Tray icon initialized\.') {
              throw "The notification-area icon was not initialized:`n$log"
            }

            # Keep the real GUI alive long enough to catch Loaded-event and async startup failures.
            $cleanObservationDeadline = (Get-Date).AddSeconds(10)
            while ((Get-Date) -lt $cleanObservationDeadline) {
              Start-Sleep -Seconds 1
              $process.Refresh()
              if ($process.HasExited) {
                throw "Application exited after loading the dashboard with code $($process.ExitCode)."
              }
              if (Test-Path $logPath) {
                $log = Get-Content $logPath -Raw
                if ($log -match 'Application initialization failed|Unable to open the main window|Unexpected application error') {
                  throw "Application failed after loading the dashboard:`n$log"
                }
              }
            }

            $process.Refresh()
            $windowHandle = $process.MainWindowHandle
            if ($windowHandle -eq [IntPtr]::Zero) {
              throw "The application has no native main window handle."
            }

            $smallIcon = [PortManagerWindowTest]::SendMessage($windowHandle, 0x007F, [IntPtr]2, [IntPtr]::Zero)
            if ($smallIcon -eq [IntPtr]::Zero) {
              $smallIcon = [PortManagerWindowTest]::GetClassLongPtr($windowHandle, -34)
            }
            $largeIcon = [PortManagerWindowTest]::SendMessage($windowHandle, 0x007F, [IntPtr]1, [IntPtr]::Zero)
            if ($largeIcon -eq [IntPtr]::Zero) {
              $largeIcon = [PortManagerWindowTest]::GetClassLongPtr($windowHandle, -14)
            }
            if ($smallIcon -eq [IntPtr]::Zero -or $largeIcon -eq [IntPtr]::Zero) {
              throw "The native window icon was not applied."
            }

            [PortManagerWindowTest]::ShowWindowAsync($windowHandle, 6) | Out-Null
            Start-Sleep -Seconds 1
            if (-not [PortManagerWindowTest]::IsIconic($windowHandle)) {
              throw "The main window could not be minimized."
            }

            [PortManagerWindowTest]::ShowWindowAsync($windowHandle, 9) | Out-Null
            [PortManagerWindowTest]::PostMessage($windowHandle, 0x0010, [IntPtr]::Zero, [IntPtr]::Zero) | Out-Null
            if (-not $process.WaitForExit(10000)) {
              throw "The application did not exit within 10 seconds after WM_CLOSE."
            }

            $log = Get-Content $logPath -Raw
            if ($log -notmatch 'Main window closed\.') {
              throw "The application exited without completing the window close handler:`n$log"
            }
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }
      - name: Zip portable app
        shell: pwsh
        run: Compress-Archive -Path artifacts/portable/${{ matrix.rid }}/* -DestinationPath artifacts/PortManager-${{ matrix.rid }}.zip
      - name: Upload portable artifact
        uses: actions/upload-artifact@v5
        with:
          name: PortManager-${{ matrix.rid }}
          path: artifacts/PortManager-${{ matrix.rid }}.zip

  installer:
    runs-on: windows-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x86
            platform: x86
            installer_arch: x86
          - rid: win-x64
            platform: x64
            installer_arch: x64
          - rid: win-arm64
            platform: ARM64
            installer_arch: arm64
    steps:
      - uses: actions/checkout@v5
      - name: Download portable build
        uses: actions/download-artifact@v5
        with:
          name: PortManager-${{ matrix.rid }}
          path: artifacts/download
      - name: Extract portable build
        shell: pwsh
        run: Expand-Archive artifacts/download/PortManager-${{ matrix.rid }}.zip artifacts/installer-source
      - name: Download Simplified Chinese installer language
        shell: pwsh
        run: |
          curl.exe --fail --silent --show-error --location `
            https://raw.githubusercontent.com/jrsoftware/issrc/1ae7bf81dc0d2013235dfe4bb0b6f4e4a0b6b25c/Files/Languages/ChineseSimplified.isl `
            --output installer/ChineseSimplified.isl
      - name: Build installer
        shell: pwsh
        run: |
          [xml]$project = Get-Content PortManager.csproj
          $version = @($project.Project.PropertyGroup.Version)[0]
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid project version: $version" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DSourceDir=$pwd\artifacts\installer-source" "/DBuildArch=${{ matrix.installer_arch }}" "/DAppVersion=$version" installer\PortManager.iss
      - name: Upload installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: PortManager-Setup-${{ matrix.rid }}
          path: artifacts/installer/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    needs: [build, installer]
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/**/*
