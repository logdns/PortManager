name: Build Port Manager

on:
  push:
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Run unit tests
        run: dotnet test PortManager.Tests/PortManager.Tests.csproj --configuration Release

  build:
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x86
            platform: x86
            installer_arch: x86
          - rid: win-x64
            platform: x64
            installer_arch: x64
          - rid: win-arm64
            platform: ARM64
            installer_arch: arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore PortManager.csproj --runtime ${{ matrix.rid }} -p:Platform=${{ matrix.platform }} -p:WindowsPackageType=None
      - name: Build
        run: dotnet build PortManager.csproj --configuration Release --no-restore -p:Platform=${{ matrix.platform }} -p:WindowsPackageType=None
      - name: Dump XAML compiler diagnostics
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem -Path obj -Recurse -Filter output.json -ErrorAction SilentlyContinue |
            ForEach-Object { Get-Content $_.FullName -Raw }
      - name: Publish portable app
        run: dotnet publish PortManager.csproj --configuration Release --no-restore --runtime ${{ matrix.rid }} --self-contained true -p:Platform=${{ matrix.platform }} -p:WindowsPackageType=None -o artifacts/portable/${{ matrix.rid }}
      - name: Keep only Chinese and English resources
        shell: pwsh
        run: |
          $publishDirectory = "artifacts/portable/${{ matrix.rid }}"
          $allowedCultures = @("en", "en-US", "zh", "zh-CN", "zh-Hans")
          $culturePattern = '^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$'
          Get-ChildItem $publishDirectory -Directory |
            Where-Object { $_.Name -match $culturePattern -and $_.Name -notin $allowedCultures } |
            Remove-Item -Recurse -Force

          $unexpected = Get-ChildItem $publishDirectory -Directory |
            Where-Object { $_.Name -match $culturePattern -and $_.Name -notin $allowedCultures }
          if ($unexpected) {
            throw "Unexpected language resources: $($unexpected.Name -join ', ')"
          }
      - name: Zip portable app
        shell: pwsh
        run: Compress-Archive -Path artifacts/portable/${{ matrix.rid }}/* -DestinationPath artifacts/PortManager-${{ matrix.rid }}.zip
      - name: Upload portable artifact
        uses: actions/upload-artifact@v5
        with:
          name: PortManager-${{ matrix.rid }}
          path: artifacts/PortManager-${{ matrix.rid }}.zip

  installer:
    runs-on: windows-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x86
            platform: x86
            installer_arch: x86
          - rid: win-x64
            platform: x64
            installer_arch: x64
          - rid: win-arm64
            platform: ARM64
            installer_arch: arm64
    steps:
      - uses: actions/checkout@v5
      - name: Download portable build
        uses: actions/download-artifact@v5
        with:
          name: PortManager-${{ matrix.rid }}
          path: artifacts/download
      - name: Extract portable build
        shell: pwsh
        run: Expand-Archive artifacts/download/PortManager-${{ matrix.rid }}.zip artifacts/installer-source
      - name: Download Simplified Chinese installer language
        shell: pwsh
        run: |
          curl.exe --fail --silent --show-error --location `
            https://raw.githubusercontent.com/jrsoftware/issrc/1ae7bf81dc0d2013235dfe4bb0b6f4e4a0b6b25c/Files/Languages/ChineseSimplified.isl `
            --output installer/ChineseSimplified.isl
      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if ($version -notmatch '^\d+\.\d+\.\d+') { $version = "1.0.0" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DSourceDir=$pwd\artifacts\installer-source" "/DBuildArch=${{ matrix.installer_arch }}" "/DAppVersion=$version" installer\PortManager.iss
      - name: Upload installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: PortManager-Setup-${{ matrix.rid }}
          path: artifacts/installer/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    needs: [build, installer]
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/**/*
